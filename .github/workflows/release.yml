name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag (for example v1.0.4). Must match the app project
          <Version>. If the tag does not exist yet it is created from the
          branch this workflow runs on; if it exists, that tag is rebuilt
          and the release assets are refreshed.
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, verify, and publish release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Resolve release tag
        id: tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $env:INPUT_TAG
          } else {
            $env:REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Release tag '$tag' must look like v<major>.<minor>.<patch>[-prerelease]."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag"

      - name: Resolve build ref
        id: buildref
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if ($env:EVENT_NAME -ne 'workflow_dispatch') {
            "ref=$env:TAG" >> $env:GITHUB_OUTPUT
            "create_tag=false" >> $env:GITHUB_OUTPUT
            Write-Host "Building pushed tag $env:TAG."
            exit 0
          }

          $tagLookupOutput = gh api `
            "repos/${{ github.repository }}/git/ref/tags/$env:TAG" `
            --silent 2>&1
          $tagLookupExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($tagLookupExitCode -eq 0) {
            "ref=$env:TAG" >> $env:GITHUB_OUTPUT
            "create_tag=false" >> $env:GITHUB_OUTPUT
            Write-Host "Tag $env:TAG already exists; rebuilding that exact tag."
          }
          elseif (($tagLookupOutput | Out-String) -match '\(HTTP 404\)') {
            "ref=$env:DISPATCH_SHA" >> $env:GITHUB_OUTPUT
            "create_tag=true" >> $env:GITHUB_OUTPUT
            Write-Host ("Tag $env:TAG does not exist yet; it will be created from " +
              "$env:DISPATCH_SHA after the build and release artifacts are verified.")
          }
          else {
            $details = ($tagLookupOutput | Out-String).Trim()
            throw ("Could not determine whether tag '$env:TAG' exists. " +
              "GitHub CLI exited with code $tagLookupExitCode. $details")
          }
          # The runner appends "exit $LASTEXITCODE" to pwsh steps, and the gh
          # probe above intentionally exits 1 when the tag is missing. Clear it
          # so the missing-tag path does not fail the step.
          exit 0

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.buildref.outputs.ref }}

      - name: Verify tag matches the app project version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath 'src/SpinFourKay.App/SpinFourKay.App.csproj'
          $projectVersion = [string]($project.Project.PropertyGroup.Version |
            Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) } |
            Select-Object -First 1)
          $tagVersion = '${{ steps.tag.outputs.version }}'
          if ($projectVersion -cne $tagVersion) {
            throw "Tag version '$tagVersion' does not match the app project <Version> '$projectVersion'. Update the project version and re-tag."
          }
          Write-Host "Tag and project agree on version $projectVersion."

      - name: Set up .NET SDK 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache pinned Magpie inputs
        uses: actions/cache@v4
        with:
          path: |
            vendor/Magpie-v0.12.1-x64.zip
            vendor/Magpie-source-v0.12.1
          key: magpie-v0.12.1

      - name: Build, run self-tests, and package
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Version '${{ steps.tag.outputs.version }}'

      - name: Verify packaged checksum sidecar
        id: package
        shell: pwsh
        run: |
          $version = '${{ steps.tag.outputs.version }}'
          $zipPath = "artifacts/SpinFOURKAYYY-$version-win-x64.zip"
          $sidecarPath = "$zipPath.sha256"
          foreach ($required in @($zipPath, $sidecarPath)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Expected release output is missing: $required"
            }
          }
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          $sidecarLine = (Get-Content -LiteralPath $sidecarPath -TotalCount 1).Trim()
          $sidecarHash = ($sidecarLine -split '\s+')[0].ToLowerInvariant()
          if ($actualHash -cne $sidecarHash) {
            throw "The checksum sidecar does not match the packaged ZIP. Sidecar: $sidecarHash; actual: $actualHash."
          }
          "zip=$zipPath" >> $env:GITHUB_OUTPUT
          "sidecar=$sidecarPath" >> $env:GITHUB_OUTPUT
          "sha256=$actualHash" >> $env:GITHUB_OUTPUT
          Write-Host "Verified $zipPath ($actualHash)."

      - name: Compose release notes
        shell: pwsh
        run: |
          $version = '${{ steps.tag.outputs.version }}'
          $sha256 = '${{ steps.package.outputs.sha256 }}'
          $notes = @"
          ## SpinFOURKAYYY $version

          Self-contained Windows x64 release. Users do not need to install .NET or Magpie separately.

          ### Verify the download

          ``````powershell
          (Get-FileHash -Algorithm SHA256 .\SpinFOURKAYYY-$version-win-x64.zip).Hash
          Get-Content .\SpinFOURKAYYY-$version-win-x64.zip.sha256
          ``````

          Expected SHA-256: ``$sha256``

          ### Install

          1. Extract the complete ZIP into a normal user-writable folder (not ``Program Files`` or the EverQuest directory).
          2. Keep ``SpinFOURKAYYY.exe``, ``Engine``, and the notice/license files together.
          3. Run ``SpinFOURKAYYY.exe``, choose a size, and use ``Start EverQuest for me``. See the README for Native clarity (100%) and automatic personal layouts at 101–200%.

          This build was produced by the tagged Release workflow run, including the deterministic self-test suite, pinned Magpie v0.12.1 verification, and license checks.
          "@
          Set-Content -LiteralPath 'release-notes.md' -Value $notes -Encoding utf8NoBOM

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpinFOURKAYYY-${{ steps.tag.outputs.version }}-win-x64-release
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sidecar }}
            release-notes.md
          if-no-files-found: error

      - name: Create the release tag
        if: steps.buildref.outputs.create_tag == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') {
            throw "Could not resolve the checked-out release commit."
          }
          gh api "repos/${{ github.repository }}/git/refs" `
            -f "ref=refs/tags/$env:TAG" `
            -f "sha=$sha"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create tag '$env:TAG' at $sha."
          }
          Write-Host "Created tag $env:TAG at $sha."

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $version = '${{ steps.tag.outputs.version }}'
          $prereleaseFlag = @()
          if ($version.Contains('-')) {
            $prereleaseFlag = @('--prerelease')
          }

          $releaseLookupOutput = gh api `
            "repos/${{ github.repository }}/releases/tags/$tag" `
            --silent 2>&1
          $releaseLookupExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($releaseLookupExitCode -eq 0) {
            Write-Host "Release $tag already exists; refreshing its assets and notes."
            gh release upload $tag `
              '${{ steps.package.outputs.zip }}' `
              '${{ steps.package.outputs.sidecar }}' `
              --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "gh release upload failed with exit code $LASTEXITCODE"
            }
            gh release edit $tag `
              --title "SpinFOURKAYYY $version" `
              --notes-file release-notes.md `
              @prereleaseFlag
            if ($LASTEXITCODE -ne 0) {
              throw "gh release edit failed with exit code $LASTEXITCODE"
            }
          }
          elseif (($releaseLookupOutput | Out-String) -match '\(HTTP 404\)') {
            gh release create $tag `
              '${{ steps.package.outputs.zip }}' `
              '${{ steps.package.outputs.sidecar }}' `
              --title "SpinFOURKAYYY $version" `
              --notes-file release-notes.md `
              --verify-tag `
              @prereleaseFlag
            if ($LASTEXITCODE -ne 0) {
              throw "gh release create failed with exit code $LASTEXITCODE"
            }
          }
          else {
            $details = ($releaseLookupOutput | Out-String).Trim()
            throw ("Could not determine whether release '$tag' exists. " +
              "GitHub CLI exited with code $releaseLookupExitCode. $details")
          }
